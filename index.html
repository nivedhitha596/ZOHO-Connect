<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoho Login</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: url("https://i.pinimg.com/736x/9c/e5/ea/9ce5ea92ab79647c5d041785ea9a1b91.jpg")
          no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 30px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        width: 350px;
        text-align: center;
      }
      .login-container img {
        width: 140px;
        margin-bottom: 20px;
      }
      .login-container h2 {
        font-size: 20px;
        color: #333;
        margin-bottom: 25px;
      }
      .login-container input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }
      .login-container button {
        width: 100%;
        padding: 12px;
        background: #e53935;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
      }
      .login-container button:hover {
        background: #c62828;
      }
      .error {
        color: red;
        font-size: 13px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <img
        src="c:\Users\nived\AppData\Local\Packages\5319275A.WhatsAppDesktop_cv1g1gvanyjgm\TempState\76D4A91E4E3EE83A467A2D783F390257\WhatsApp Image 2025-09-26 at 21.29.37_addd3eac.jpg"
      />
      <h2>Connect via ZOHO</h2>
      <form onsubmit="return loginUser(event)">
        <input type="email" id="username" placeholder="Zoho Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p class="error" id="errorMsg">Invalid credentials. Try again.</p>
      </form>
    </div>

    <script>
      function loginUser(event) {
        event.preventDefault();
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;

        // Demo credentials
        if (user === "user@zoho.com" && pass === "password123") {
          localStorage.setItem("loggedInUser", user); // store session
          window.location.href = "home.html"; // redirect to dashboard
        } else {
          document.getElementById("errorMsg").style.display = "block";
        }
      }
    </script>
    <script>
function toggleChat(){
  const chat = document.getElementById("chatWindow");
  chat.style.display = chat.style.display==="block" ? "none" : "block";
}

function sendMessage(){
  let input = document.getElementById("chatInput");
  let msg = input.value.trim();
  if(msg==="") return;

  let chatBox = document.getElementById("chatMessages");

  // Show user message
  chatBox.innerHTML += <p><b>You:</b> ${msg}</p>;

  // Default reply
  let reply = "Sorry, I don’t understand. Try asking about 'upcoming', 'past', or 'schedule'.";

  // Rule-based chatbot replies
  if(msg.toLowerCase().includes("upcoming")){
    reply = "Your next meeting is tomorrow at 10 AM about Product Updates.";
  }
  else if(msg.toLowerCase().includes("past")){
    reply = "Last meeting was on Sept 25 about Sales Review.";
  }
  else if(msg.toLowerCase().includes("schedule")){
    reply = "Click on 'Schedule Meeting' card to add a new one.";
  }
  else if(msg.toLowerCase().includes("hello")){
    reply = "Hello 👋 How can I help you with meetings?";
  }

  // Show bot reply
  chatBox.innerHTML += <p><b>Bot:</b> ${reply}</p>;

  // Clear input
  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}
    </script>
  </body>
</html>
